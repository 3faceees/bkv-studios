<style>
:root{--fond:#f6f6f4;--carte:#fff;--texte:#1d1d1f;--doux:#6e6e73;--bord:#e4e4e0}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
header{max-width:680px;margin:0 auto;padding:22px 16px 0;font-weight:700;letter-spacing:.08em;font-size:14px}
main{max-width:680px;margin:12px auto 0;padding:0 16px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:8px 18px 4px}
iframe{display:block;width:100%;border:0;min-height:760px}
footer{max-width:680px;margin:0 auto;padding:18px 16px 40px;color:var(--doux);font-size:13px}
footer a{color:var(--doux)}
</style>
</head>
<body>
<header>BKV</header>
<main>
  <div class="carte">
    <iframe id="tally" title="Audit gratuit de ton studio" loading="eager"></iframe>
  </div>
</main>
<footer>BKV · Benjamin Kauffmann · <a href="confidentialite.html">Confidentialité</a></footer>

<script>
(function () {
  var FORM = "rDBxN2";
  var leadEnvoye = false;

  // Le formulaire Tally, avec les paramètres utm de la pub
  var src = "https://tally.so/embed/" + FORM + "?alignLeft=1&hideTitle=0&transparentBackground=1&dynamicHeight=1";
  var q = new URLSearchParams(location.search);
  ["utm_source", "utm_medium", "utm_campaign", "utm_content"].forEach(function (k) {
    if (q.get(k)) src += "&" + k + "=" + encodeURIComponent(q.get(k));
  });
  var iframe = document.getElementById('tally');
  iframe.setAttribute('data-tally-src', src);
  var s = document.createElement('script');
  s.src = "https://tally.so/widgets/embed.js";
  s.onload = function () { if (window.Tally) Tally.loadEmbeds(); else iframe.src = src; };
  s.onerror = function () { iframe.src = src; };
  document.body.appendChild(s);

  // Tally prévient la page quand le formulaire est envoyé : c'est le Lead
  window.addEventListener('message', function (e) {
    var hote = '';
    try { hote = new URL(e.origin).hostname; } catch (err) { return; }
    if (hote !== 'tally.so' && !/\.tally\.so$/.test(hote)) return;
    var d = e.data;
    if (typeof d === 'string') {
      try { d = JSON.parse(d); }
      catch (err) { if (d.indexOf('Tally.FormSubmitted') === -1) return; d = { event: 'Tally.FormSubmitted' }; }
    }
    if (d && d.event === 'Tally.FormSubmitted' && !leadEnvoye) {
      leadEnvoye = true;
      fbq('track', 'Lead');
    }
  });
})();
</script>
</body>
</html>
